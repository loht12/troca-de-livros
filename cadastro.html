<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area de login</title>
    <link rel="stylesheet" href="cadastro.css">
    <title>Area de Login</title>

</head>

<body>

    <main>
        <section class="sessao-imagem">
            <img src="img/tela-login.png" alt="">
        </section>
        <section class="sessao-login">
            <div class="area-titulo">
                <h1>Conect <span>Bookss</span></h1>
                <h2>Troque livros, multiplique historias</h2>
            </div>
            <form action="#" method="post">
                <label for="email"> Nome </label>
                <input type="text" id="nome" placeholder="Informe seu nome">

                <label for="email"> Usuario </label>
                <input type="text" id="usuario" placeholder="Informe seu usuario">

                <label for="email"> Email </label>
                <input type="text" id="email" placeholder="Informe seu email">

                <div class="area-senha">
                    <div>
                        <label for="senha"> Senha </label>
                        <input type="password" id="senha" placeholder=" Senha">
                    </div>

                    <div>
                        <label for="senha"> Confirmar senha </label>
                        <input type="password" id="confirmar-senha" placeholder="Confirme sua senha">
                    </div>

                </div>

                <button id="btn-acessar">Cadastrar-se</button>
                <a href="login.html" id="link-nao-conta"> Já possuo uma conta, acessar agora </a>
            </form>
        </section>

    </main>

</body>

</html>
