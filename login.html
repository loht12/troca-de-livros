<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area de login</title>
    <link rel="stylesheet" href="login.css">
    <title>Area de Login</title>

</head>
<body>
    
    <main>
       <section class="sessao-imagem">
        <img src="img/tela-login.png" alt="">
       </section>
       <section class="sessao-login"> 
            <div class="area-titulo">
                <h1>Conect <span>Bookss</span></h1>
                <h2>Troque livros, multiplique historias</h2>
            </div>
                <form action="#" method="post">
                    <label for="email"> Usuario ou Email </label>
                    <input type="text" id="email" placeholder="Informe seu email">

                    <label for="senha"> Senha </label>
                    <input type="password" id="senha" placeholder="Informe sua senha">

                    <div class="links-senha">
                        <input type="checkbox" id="Lembrar-senha">
                        <label for=""> Lembrar senha </label>

                        <a href="#" id="Esqueceu-senha"> Esqueceu a senha? </a>
                    </div>

                    <button id="btn-acessar">Acessar</button>
                    <a href="#" id="link-nao-conta"> Ainda não possuo uma conta </a>

                </form>
       </section>

    </main>

</body>
</html>
